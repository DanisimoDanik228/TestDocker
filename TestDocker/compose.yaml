services:
  api:
    build:
      context: ..
      dockerfile: TestDocker/Dockerfile
    container_name: testdocker_api
    ports:
      - "5000:8080"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: testdocker_postgres
    environment:
      POSTGRES_DB: TestDocker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 76127612
    ports:
      - "5432:5432"